<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNG DEV V8 MATRIX</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020805;color:#b8ffca;font-family:Consolas,monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:-1;opacity:.2}
header{padding:20px;text-align:center;border-bottom:1px solid #087b38;background:#001609}
h1{color:#38ff75;text-shadow:0 0 15px #00ff55;margin:0}
header p{color:#70b88a}
main{max-width:1450px;margin:auto;padding:18px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border:1px solid #087b38;background:#031109ed;border-radius:10px;padding:15px;box-shadow:0 0 18px #00ff5510}
h3{margin:0 0 12px;color:#42ff80}
textarea,input,select{width:100%;background:#010703;color:#a7ffba;border:1px solid #126c34;border-radius:7px;padding:12px;outline:none;font:13px Consolas}
textarea{height:280px;resize:vertical}
input{margin-top:7px;margin-bottom:12px}
button,select{background:#06351a;color:#72ff9c;border:1px solid #16a34a;padding:11px;border-radius:6px;font-weight:bold}
button{cursor:pointer}
button:hover{background:#0a5728}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
select{margin:7px 0 12px}
#log{height:105px;overflow:auto;color:#64d887;font-size:12px;background:#010703;padding:9px;margin-top:10px;border:1px solid #104c28}
.status{color:#39ff78;margin:12px 0}
.small-text{height:75px;min-height:75px}
label{display:block;margin-top:10px;color:#8ddba2;font-size:11px}
@media(max-width:800px){.layout{grid-template-columns:1fr}textarea{height:260px}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<header>
<h1>dng team ohub</h1>
<p>LUАU MATRIX OBFUSCATOR • NUMBER STRING ENCODER</p>
</header>
<main>
<div class="layout">
<section class="panel">
<h3>01 / SOURCE CODE</h3>
<textarea id="src" spellcheck="false" placeholder="Dán mã Lua/Luau vào đây..."></textarea>
<label>level làm rối code khuyên chọn level 3</label>
<select id="level">
<option value="1">LEVEL 1 - Basic</option>
<option value="2">LEVEL 2 - Strong</option>
<option value="3">LEVEL 3 - Advanced</option>
</select>
<div class="actions">
<button onclick="run()">⚡ ENCODE CODE</button>
<button onclick="clearAll()">CLEAR</button>
</div>
<div class="status" id="status">SYSTEM READY</div>
<div id="log">[DNG] Waiting for source...</div>
</section>

<section class="panel">
<h3>02 / ENCODED OUTPUT</h3>
<textarea id="out" spellcheck="false" readonly placeholder="Code đã mã hóa sẽ hiện ở đây..."></textarea>
<div class="actions">
<button onclick="copyOutput()">COPY CODE</button>
<button onclick="downloadOutput()">DOWNLOAD LUA</button>
</div>

<h3 style="margin-top:20px">03 / GITHUB UPLOADER</h3>
<label>FILE NAME</label>
<input id="filename" value="dngdev.lua">
<div class="actions">
<button onclick="uploadGitHub()">🚀 UPLOAD TO GITHUB</button>
</div>
<div class="status" id="ghStatus">WAITING...</div>

<label>RAW URL</label>
<textarea id="raw" class="small-text" readonly></textarea>
<button onclick="copyOutputText('raw')">COPY RAW</button>

<label>LOADSTRING</label>
<textarea id="load" class="small-text" readonly></textarea>
<button onclick="copyOutputText('load')">COPY LOADSTRING</button>
</section>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
function log(s){
 const el=$("log");
 el.textContent+="\n> "+s;
 el.scrollTop=el.scrollHeight;
}
function randomName(used){
 let n;
 do{
  n="_"+Array.from({length:9},()=> "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"[Math.floor(Math.random()*52)]).join("");
 }while(used.has(n));
 used.add(n);
 return n;
}
function encodeString(str){
 const bytes=new TextEncoder().encode(str);
 return "{"+Array.from(bytes).join(",")+"}";
}
function tokenize(code){
 const tokens=[];
 let i=0;
 while(i<code.length){
  const start=i,c=code[i],next=code[i+1];
  if(/\s/.test(c)){i++;while(i<code.length&&/\s/.test(code[i]))i++;tokens.push({v:code.slice(start,i),type:"space"});continue}
  if(c==="-"&&next==="-"){
   if(code.slice(i,i+3)==="--!"){
    i+=3;while(i<code.length&&code[i]!=="\n")i++;
    tokens.push({v:code.slice(start,i),type:"directive"});continue;
   }
   i+=2;
   while(i<code.length&&code[i]!=="\n")i++;
   tokens.push({v:code.slice(start,i),type:"comment"});continue;
  }
  if(c==="["&&(/^\[=*\[/.test(code.slice(i)))){
   const m=code.slice(i).match(/^\[(=*)\[/);
   const close="]"+m[1]+"]";
   i+=m[0].length;
   const end=code.indexOf(close,i);
   i=end<0?code.length:end+close.length;
   tokens.push({v:code.slice(start,i),type:"long"});continue;
  }
  if(c==="'"||c==='"'){
   i++;
   while(i<code.length){
    if(code[i]==="\\"){i+=2;continue}
    if(code[i]===c){i++;break}
    i++;
   }
   tokens.push({v:code.slice(start,i),type:"string"});continue;
  }
  if(/[A-Za-z_]/.test(c)){
   i++;while(i<code.length&&/[A-Za-z0-9_]/.test(code[i]))i++;
   tokens.push({v:code.slice(start,i),type:"id"});continue;
  }
  if(/[0-9]/.test(c)){
   i++;while(i<code.length&&/[A-Za-z0-9_.]/.test(code[i]))i++;
   tokens.push({v:code.slice(start,i),type:"number"});continue;
  }
  const op=["...","..=","==","~=","<=",">=","::","//","<<",">>","+=","-=","*=","/=",".."];
  const found=op.find(x=>code.startsWith(x,i));
  i+=found?found.length:1;
  tokens.push({v:code.slice(start,i),type:"symbol"});
 }
 return tokens;
}
const keywords=new Set(("and break do else elseif end false for function if in local nil not or repeat return then true until while continue export type typeof").split(" "));
const globals=new Set(("game workspace script shared _G _VERSION Enum Instance Vector2 Vector3 CFrame Color3 UDim UDim2 BrickColor RaycastParams TweenInfo task coroutine math string table utf8 os debug pairs ipairs next pcall xpcall assert error print warn require select tonumber tostring type typeof rawequal rawget rawset setmetatable getmetatable unpack wait spawn delay tick time").split(" "));
function decodeLiteral(raw){
 const q=raw[0];
 if(raw[raw.length-1]!==q)return null;
 const inner=raw.slice(1,-1);
 if(inner.includes("\\")||inner.includes("\n")||inner.includes("\r"))return null;
 return inner;
}
function obfuscate(source,level){
 const tokens=tokenize(source);
 const used=new Set(tokens.filter(t=>t.type==="id").map(t=>t.v));
 const map=new Map();
 const significant=tokens.filter(t=>!["space","comment","directive"].includes(t.type));
 for(let i=0;i<significant.length;i++){
  const t=significant[i];
  if(t.v==="local"&&significant[i+1]?.type==="id"){
   const n=significant[i+1].v;
   if(!keywords.has(n)&&!globals.has(n)&&!map.has(n))map.set(n,randomName(used));
  }
 }
 for(let i=0;i<significant.length;i++){
  if(significant[i].v==="function"){
   let j=i+1;
   while(j<significant.length&&significant[j].v!=="("&&j<i+20)j++;
   if(significant[j]?.v==="("){
    for(let k=j+1;k<significant.length&&significant[k].v!==")";k++){
     if(significant[k].type==="id"&&!keywords.has(significant[k].v)&&!globals.has(significant[k].v)){
      const n=significant[k].v;
      if(!map.has(n))map.set(n,randomName(used));
     }
    }
   }
  }
 }
 let output="";
 for(let i=0;i<tokens.length;i++){
  const t=tokens[i];
  if(t.type==="comment")continue;
  if(t.type==="string"&&level>=1){
   const decoded=decodeLiteral(t.v);
   if(decoded!==null){output+="(function(t)local r={} for i=1,#t do r[i]=string.char(t[i]) end return table.concat(r) end)("+encodeString(decoded)+")";continue}
  }
  if(t.type==="id"&&map.has(t.v))output+=map.get(t.v);
  else output+=t.v;
 }
 return output;
}
function run(){
 const source=$("src").value;
 if(!source.trim()){alert("Dán code vào trước!");return}
 $("log").textContent="";
 $("status").textContent="PROCESSING...";
 try{
  const level=Number($("level").value);
  const result=obfuscate(source,level);
  $("out").value=result;
  $("status").textContent="ENCODE COMPLETE";
  log("Tokenized source");
  log("Encoded plain string literals as byte arrays");
  log("Applied conservative identifier renaming");
  log("Done.");
 }catch(e){
  $("status").textContent="ERROR";
  log(String(e));
 }
}
function clearAll(){$("src").value="";$("out").value="";$("status").textContent="SYSTEM READY";$("log").textContent="[DNG] Cleared"}
async function copyOutput(){
 if(!$("out").value)return;
 try{await navigator.clipboard.writeText($("out").value);log("Copied output")}
 catch(e){$("out").select();document.execCommand("copy");log("Copy attempted")}
}
async function copyOutputText(id){
 const el=$(id);
 if(!el.value)return;
 try{await navigator.clipboard.writeText(el.value);log("Copied "+id)}
 catch(e){el.select();document.execCommand("copy");}
}
function downloadOutput(){
 const blob=new Blob([ $("out").value ],{type:"text/plain"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="dngdev.lua";a.click();
 URL.revokeObjectURL(a.href);
}

// GITHUB UPLOADER TÍCH HỢP NGẦM
async function uploadGitHub(){
 const token = " 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";
 const owner = "b23139793-coder";
 const repo = "Kh-nh-Mai-Hub";
 const branch = "main";
 const filename = $("filename").value.trim();
 const code = $("out").value;
 const ghStatus = $("ghStatus");

 if(!filename || !code){
  ghStatus.textContent="[ERROR] Nhập tên file và tạo output trước!";
  return;
 }
 if(filename.startsWith("/") || filename.includes("\\") || !filename.toLowerCase().endsWith(".lua")){
  ghStatus.textContent="[ERROR] Tên file phải kết thúc bằng .lua";
  return;
 }

 const path = filename.split("/").map(encodeURIComponent).join("/");
 const api = "https://api.github.com/repos/" + encodeURIComponent(owner) + "/" + encodeURIComponent(repo) + "/contents/" + path;
 const headers = {
  "Authorization": "Bearer " + token,
  "Accept": "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28"
 };

 try{
  ghStatus.textContent="[GITHUB] Đang kiểm tra kho...";
  let sha = null;
  const check = await fetch(api + "?ref=" + encodeURIComponent(branch), {headers});
  if(check.ok) sha = (await check.json()).sha;
  else if(check.status !== 404) throw Error((await check.json()).message);

  const bytes = new TextEncoder().encode(code);
  let binary = "";
  for(let i=0; i<bytes.length; i+=8192)
   binary += String.fromCharCode(...bytes.subarray(i, i+8192));

  const body = {
   message: "DNG DEV V8 upload",
   content: btoa(binary),
   branch: branch
  };
  if(sha) body.sha = sha;

  ghStatus.textContent="[GITHUB] Đang tải lên...";
  const response = await fetch(api, {
   method: "PUT",
   headers: {"Content-Type": "application/json", ...headers},
   body: JSON.stringify(body)
  });
  const data = await response.json();
  if(!response.ok) throw Error(data.message || "Upload thất bại");

  const raw = "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + branch + "/" + path;
  $("raw").value = raw;
  $("load").value = 'loadstring(game:HttpGet("' + raw + '"))()';
  ghStatus.textContent = "[UPLOAD THÀNH CÔNG] File: " + filename;
  log("Uploaded to GitHub successfully.");
 }catch(e){
  ghStatus.textContent = "[UPLOAD ERROR] " + e.message;
  log("GitHub error: " + e.message);
 }
}

const canvas=$("rain"),ctx=canvas.getContext("2d");
let drops=[];
function resize(){
 canvas.width=innerWidth;canvas.height=innerHeight;
 drops=Array(Math.ceil(canvas.width/17)).fill(1);
}
resize();addEventListener("resize",resize);
setInterval(()=>{
 ctx.fillStyle="rgba(0,0,0,.08)";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="#20ff62";ctx.font="14px monospace";
 drops.forEach((y,i)=>{
  ctx.fillText("01アイウカキクケコ"[Math.floor(Math.random()*12)],i*17,y*17);
  if(y*17>canvas.height&&Math.random()>.975)drops[i]=0;
  drops[i]++;
 });
},55);
</script>
</body>
</html>
